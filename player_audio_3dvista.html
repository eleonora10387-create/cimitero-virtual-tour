<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player audio 3DVista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #5d5d5d;
    font-family: "Cinzel", Georgia, serif;
  }

  .player {
    width: 100%;
    padding: 4px 2px 2px;
    background: transparent;
  }


  .controls {
    display: grid;
    grid-template-columns: auto auto minmax(110px, 1fr) auto;
    gap: 10px;
    align-items: center;
  }

  button {
    appearance: none;
    border: none;
    background: transparent;
    color: #5b5b5b;
    cursor: pointer;
    padding: 0;
    margin: 0;
    font-family: "Cinzel", Georgia, serif;
    font-size: 14px;
    line-height: 1;
    letter-spacing: .04em;
  }

  button:hover { opacity: .78; }
  button:focus-visible {
    outline: 1px solid #8f8f8f;
    outline-offset: 3px;
  }

  #playPause {
    min-width: 22px;
    text-align: center;
    font-size: 17px;
  }

  #back10 {
    font-size: 12px;
    white-space: nowrap;
  }

  .seek {
    width: 100%;
    margin: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }

  .seek:focus { outline: none; }

  .seek::-webkit-slider-runnable-track {
    height: 2px;
    background: linear-gradient(to right, #676767 0%, #676767 var(--progress, 0%), #d3d3d3 var(--progress, 0%), #d3d3d3 100%);
    border-radius: 999px;
  }

  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #676767;
    margin-top: -4px;
    border: none;
  }

  .seek::-moz-range-track {
    height: 2px;
    background: #d3d3d3;
    border: none;
    border-radius: 999px;
  }

  .seek::-moz-range-progress {
    height: 2px;
    background: #676767;
    border-radius: 999px;
  }

  .seek::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border: none;
    border-radius: 50%;
    background: #676767;
  }

  .time {
    min-width: 110px;
    text-align: right;
    font-size: 11px;
    letter-spacing: .04em;
    color: #676767;
    white-space: nowrap;
  }

  @media (max-width: 540px) {
    .controls {
      grid-template-columns: auto auto 1fr;
      row-gap: 8px;
    }
    .time {
      grid-column: 1 / -1;
      text-align: right;
    }
  }
</style>
</head>
<body>
  <div class="player">
    <div class="controls">
      <button id="playPause" type="button" aria-label="Riproduci">▶</button>
      <button id="back10" type="button" aria-label="Torna indietro di 10 secondi">↶ 10</button>

      <input id="seek" class="seek" type="range" min="0" max="100" step="0.1"
             value="0" aria-label="Posizione audio">

      <div class="time">
        <span id="current">0:00</span> / <span id="duration">0:00</span>
      </div>
    </div>

    <audio id="audio" preload="metadata">
      <source id="source" src="audio.mp3" type="audio/mpeg">
    </audio>
  </div>

<script>
(() => {
  const audio = document.getElementById('audio');
  const source = document.getElementById('source');
  const playPause = document.getElementById('playPause');
  const back10 = document.getElementById('back10');
  const seek = document.getElementById('seek');
  const current = document.getElementById('current');
  const duration = document.getElementById('duration');

  const params = new URLSearchParams(window.location.search);
  const audioParam = params.get('audio');
  if (audioParam) {
    source.src = audioParam;
    audio.load();
  }

  function fmt(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgressStyle() {
    const max = Number(seek.max) || 0;
    const val = Number(seek.value) || 0;
    const progress = max > 0 ? (val / max) * 100 : 0;
    seek.style.setProperty('--progress', `${progress}%`);
  }

  function syncButton() {
    const playing = !audio.paused && !audio.ended;
    playPause.textContent = playing ? '❚❚' : '▶';
    playPause.setAttribute('aria-label', playing ? 'Pausa' : 'Riproduci');
  }

  playPause.addEventListener('click', async () => {
    if (audio.paused || audio.ended) {
      try { await audio.play(); } catch (e) {}
    } else {
      audio.pause();
    }
    syncButton();
  });

  back10.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  function syncDuration() {
    let total = audio.duration;

    // In alcuni WebFrame il metadata può essere già disponibile prima
    // che l'evento loadedmetadata venga intercettato. Come fallback,
    // usa anche l'estremo dell'intervallo seekable quando disponibile.
    if ((!Number.isFinite(total) || total <= 0) && audio.seekable.length) {
      const seekableEnd = audio.seekable.end(audio.seekable.length - 1);
      if (Number.isFinite(seekableEnd) && seekableEnd > 0) total = seekableEnd;
    }

    if (Number.isFinite(total) && total > 0) {
      duration.textContent = fmt(total);
      seek.max = total;
      updateProgressStyle();
    }
  }

  audio.addEventListener('loadedmetadata', syncDuration);
  audio.addEventListener('durationchange', syncDuration);
  audio.addEventListener('loadeddata', syncDuration);
  audio.addEventListener('canplay', syncDuration);

  audio.addEventListener('timeupdate', () => {
    if (!seek.matches(':active')) seek.value = audio.currentTime || 0;
    current.textContent = fmt(audio.currentTime);
    updateProgressStyle();
  });

  seek.addEventListener('input', () => {
    audio.currentTime = Number(seek.value);
    current.textContent = fmt(audio.currentTime);
    updateProgressStyle();
  });

  audio.addEventListener('play', syncButton);
  audio.addEventListener('pause', syncButton);
  audio.addEventListener('ended', syncButton);

  // Aggiorna subito la durata se il browser/WebFrame ha già caricato i metadata.
  syncDuration();
  updateProgressStyle();
})();
</script>
</body>
</html>
