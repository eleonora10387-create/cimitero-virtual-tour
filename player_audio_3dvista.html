<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player audio 3DVista</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, "Times New Roman", serif;
    color: #5b5b5b;
  }

  .player {
    width: 100%;
    padding: 6px 4px 4px;
  }

  .label {
    margin: 0 0 8px;
    font-size: 14px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .controls {
    display: grid;
    grid-template-columns: 38px 38px minmax(90px, 1fr) auto;
    gap: 8px;
    align-items: center;
  }

  button {
    width: 38px;
    height: 38px;
    border: 1px solid #777;
    border-radius: 50%;
    background: transparent;
    color: #555;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }

  button:hover { background: rgba(0,0,0,.05); }
  button:focus-visible { outline: 2px solid #555; outline-offset: 2px; }

  .seek {
    width: 100%;
    accent-color: #666;
    cursor: pointer;
  }

  .time {
    min-width: 92px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    color: #666;
    text-align: right;
    white-space: nowrap;
  }

  @media (max-width: 420px) {
    .controls {
      grid-template-columns: 38px 38px minmax(70px, 1fr);
    }
    .time {
      grid-column: 1 / -1;
      text-align: right;
    }
  }
</style>
</head>
<body>
  <div class="player">
    <div class="label">Ascolta</div>

    <div class="controls">
      <button id="playPause" type="button" aria-label="Riproduci">▶</button>
      <button id="back10" type="button" aria-label="Torna indietro di 10 secondi">↶10</button>

      <input id="seek" class="seek" type="range" min="0" max="100" step="0.1"
             value="0" aria-label="Posizione audio">

      <div class="time">
        <span id="current">0:00</span> / <span id="duration">0:00</span>
      </div>
    </div>

    <audio id="audio" preload="metadata">
      <source id="source" src="audio.mp3" type="audio/mpeg">
    </audio>
  </div>

<script>
(() => {
  const audio = document.getElementById('audio');
  const source = document.getElementById('source');
  const playPause = document.getElementById('playPause');
  const back10 = document.getElementById('back10');
  const seek = document.getElementById('seek');
  const current = document.getElementById('current');
  const duration = document.getElementById('duration');

  // Facoltativo: consente di usare player.html?audio=nomefile.mp3
  const params = new URLSearchParams(window.location.search);
  const audioParam = params.get('audio');
  if (audioParam) {
    source.src = audioParam;
    audio.load();
  }

  function fmt(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function syncButton() {
    const playing = !audio.paused && !audio.ended;
    playPause.textContent = playing ? '❚❚' : '▶';
    playPause.setAttribute('aria-label', playing ? 'Pausa' : 'Riproduci');
  }

  playPause.addEventListener('click', async () => {
    if (audio.paused || audio.ended) {
      try { await audio.play(); } catch (e) {}
    } else {
      audio.pause();
    }
    syncButton();
  });

  back10.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  audio.addEventListener('loadedmetadata', () => {
    duration.textContent = fmt(audio.duration);
    seek.max = Number.isFinite(audio.duration) ? audio.duration : 0;
  });

  audio.addEventListener('timeupdate', () => {
    if (!seek.matches(':active')) seek.value = audio.currentTime || 0;
    current.textContent = fmt(audio.currentTime);
  });

  seek.addEventListener('input', () => {
    audio.currentTime = Number(seek.value);
    current.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('play', syncButton);
  audio.addEventListener('pause', syncButton);
  audio.addEventListener('ended', syncButton);
})();
</script>
</body>
</html>
